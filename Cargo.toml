[package]
name = "minihabits-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An authenticated, LAN-ready habit system built with Leptos, Axum, and SQLite."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"], optional = true }
# SQLx 0.8 and rusqlite must share the same native SQLite dependency.
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
serde_json = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"], optional = true }

sha2 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
axum-login = { version = "=0.18.0", optional = true }
tower-sessions = { version = "=0.14.0", default-features = false, features = ["axum-core"], optional = true }
tower-sessions-sqlx-store = { version = "=0.15.0", features = ["sqlite"], optional = true }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
time = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
url = { version = "2", optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys"]
ssr = ["dep:sha2", "dep:argon2", "dep:axum-login", "dep:tower-sessions", "dep:tower-sessions-sqlx-store", "dep:sqlx", "dep:time", "dep:getrandom", "dep:url", "dep:axum", "dep:leptos_axum", "dep:tokio", "dep:rusqlite", "dep:uuid", "dep:serde_json", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "minihabits-rust"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:5175"
reload-port = 5176
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
